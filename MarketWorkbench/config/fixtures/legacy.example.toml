# Custom Market V1 config example for the EveJS 0.12.9 development copy.
# Builds the canonical five-hub synthetic book; TQ snapshot rows provide reference
# evidence only and are not written at their source stations.
#
# Every value below is also the built-in default, so an empty file behaves identically.

[input]
# Generated local Public EveJS authority data (stations, systems, itemTypes,
# industryBlueprints, typeDogma). Run tools\DatabaseCreator\CreateDatabase.bat to make it.
# Omit this key to fall back to EVEJS_GAMESTORE_DATA_DIR, then to the path below.
static_data_dir = "../../_local/gameStore/data"

[output]
# Choose an isolated candidate path and verify it before any separate deployment.
database_path = "../../externalservices/market-server/data/generated/market.sqlite"

[source]
# EVE Ref publishes the latest full public market order snapshot here.
index_url = "https://data.everef.net/market-orders/index.json"
download_dir = "cache"
user_agent = "PublicEveJS market-seederv3/0.1"

[import]
# npc_only imports exactly the TQ NPC sell+buy orders (bucket C) at their authentic
# stations and no player orders at all. NPC orders are the ones with a duration above
# the threshold below. Other modes: all_station, player_only, market_scope,
# market_scope_with_npc.
order_filter = "npc_only"
npc_order_duration_threshold_days = 90

# Whether audit check 4 FAILS the build on a haul loop with no seeder-priced leg at all —
# TQ selling a trade good in one station for less than TQ buys it back in another. Those come
# in verbatim with the snapshot; decision 2 keeps the NPC catalog TQ-authentic, and real EVE
# genuinely has NPC spreads at fixed prices. Closing them would mean discarding or repricing
# NPC rows CCP ships, so by default they are reported in their own section and do not gate.
# Both counts are printed in the verdict either way — the residue is never hidden.
gate_on_npc_arbitrage = false

[price_manifest]
# One committed artifact holding the resolved price and provenance for every seeded type.
# CCP-captured entries are permanent: once captured they are never refetched, so builds
# stay deterministic and offline after the first capture.
path = "data/price-manifest.json"
capture_missing_from_snapshot = true   # Jita top-of-book harvested from the snapshot stream
capture_missing_from_esi = true        # gap-filler for types with no live Jita order
esi_prices_url = "https://esi.evetech.net/latest/markets/prices/"
reference_solar_system_id = 30000142   # Jita. The snapshot capture reads this SYSTEM's whole
                                       # book -- every order in it, including the ones
                                       # order_filter drops from the NPC overlay, because
                                       # Jita's real top-of-book is mostly player orders.
                                       # Price = (min ask + max bid) / 2 when both sides
                                       # exist, otherwise the side that does.

[canonical_market]
station_ids = [60003760, 60008494, 60011866, 60004588, 60005686]
quantity = 2147483647

[market_roles]
lp_offer_catalog_path = "../../server/src/services/loyalty/lpStoreStaticOffers.json"
# Datacores, Ancient Salvage, Generic Decryptors; moon groups are Bridge only when disabled.
bridge_group_ids = [333, 427, 966, 1304, 1884, 1920, 1921, 1922, 1923]
bridge_type_ids = [25591, 25592, 25594, 25610, 25618, 25619, 25620, 25621, 25623, 33195, 57450]
progression_npc_group_ids = [4086]
progression_npc_type_ids = [41, 3685, 3687, 3812, 3814, 9850, 3773]
moon_mining_available = true
planetary_industry_buy_enabled = true

