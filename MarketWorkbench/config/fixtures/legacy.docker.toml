# Docker configuration for the custom five-hub Market V1 seeder (market-seederv3).
#
# This is tools/market-seederv3/config/market-seederv3.local.toml with the paths moved
# into the container and the build tuning lowered, and NOTHING ELSE. Every pricing knob
# below is byte-identical to the local config on purpose: a deployment that quietly seeds
# different economics from a developer machine is a bug, not a deployment setting. The
# rationale for each value lives in tools/market-seederv3/config/market-seederv3.example.toml
# and doc/JITA_INDEX_SEED_PLAN.md; it is not repeated here, so the two files stay diffable.
#
# Never point [output] database_path at the live market.sqlite. The entrypoint builds a
# candidate, validates it, audits it, backs the live database up and only then installs it.

[input]
# Built by the init service into the evejs-data volume (docker/entrypoint.sh ensure_gamestore).
static_data_dir = "/var/lib/evejs/gameStore/data"

[output]
# MARKET_CANDIDATE in docker/entrypoint.sh. The live database is never opened by the seeder.
database_path = "/var/lib/evejs/market/market.sqlite.candidate"

[source]
index_url = "https://data.everef.net/market-orders/index.json"
# Beside the v1 SDE and v2 snapshot caches in the volume, so the download survives
# container replacement and an image rebuild. Created by `snapshot-info --download`.
download_dir = "/var/lib/evejs/downloads/market-v3"
user_agent = "PublicEveJS market-seederv3/0.1"

[import]
order_filter = "npc_only"
npc_order_duration_threshold_days = 90
gate_on_npc_arbitrage = false

[price_manifest]
# Committed to the repo and baked into the image, which is what makes a container rebuild
# seed exactly what a developer machine seeds. Captures are permanent and `build` only ever
# reads this file, so nothing here is written at deployment time.
path = "/app/tools/market-seederv3/data/price-manifest.json"
capture_missing_from_snapshot = true
capture_missing_from_esi = true
esi_prices_url = "https://esi.evetech.net/latest/markets/prices/"

[canonical_market]
station_ids = [60003760, 60008494, 60011866, 60004588, 60005686]
quantity = 2147483647

[market_roles]
