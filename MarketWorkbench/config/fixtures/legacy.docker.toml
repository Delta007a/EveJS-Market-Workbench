[index_seed]
station_id = 60003760
sell_multiplier = 3.0
buy_multiplier = 1.0
quantity = 2147483647
pricing = "recursive"
price_floor = 100.0
max_unpriced_drops = 25
leaf_price_source = "capture-first"
defer_to_npc_catalog = "conflicting-prices"
reject_adjusted_price_captures = true
derive_compressed_from_source = true
floor_cost_at_reprocessing_value = true
reprocessing_floor_margin = 0.001

[junk_seed]
enabled = true
categories = ["modules", "commodities", "charges", "drones", "decryptors"]
sell_multiplier = 3.0
buy_multiplier = 1.0
quantity = 2147483647

[history]
enabled = true
days = 30

[build]
# Matches docker/market-seed-v2.toml: a container gets a share of the host, not a
# workstation's whole CPU, so the local 24 worker threads come down to 8. Tuning only —
# no seeded row and no price changes with these.
sqlite_cache_size_kib = 262144
sqlite_page_size_bytes = 32768
sqlite_worker_threads = 8
insert_batch_rows = 100000
